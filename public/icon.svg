<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- 3R Circular loop with leaf -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Central Leaf & Recycle Motif -->
    <path d="M256 120 C180 120 140 180 140 256 C140 332 190 380 256 392 C322 380 372 332 372 256 C372 180 332 120 256 120 Z" fill="none" stroke="#ecfdf5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central stylized 3R leaf core -->
    <path d="M256 150 C290 200 330 240 330 280 C330 320 296 350 256 350 C216 350 182 320 182 280 C182 240 222 200 256 150 Z" fill="url(#leaf)" />
    <path d="M256 170 L256 340" stroke="#047857" stroke-width="10" stroke-linecap="round" />
    <path d="M256 240 Q290 220 305 250" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M256 270 Q220 250 205 280" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Outer accent dots representing 3R -->
  <circle cx="150" cy="170" r="14" fill="#a7f3d0" />
  <circle cx="362" cy="170" r="14" fill="#a7f3d0" />
  <circle cx="256" cy="420" r="14" fill="#a7f3d0" />
</svg>
