    <!-- Early suppression of noisy third-party browser extension errors (e.g. sender-wallet, metamask, etc.) -->
    <script>
      (function() {
        function isWalletNoise(val) {
          if (!val) return false;
          try {
            var str = typeof val === 'string' ? val : (typeof val === 'object' ? JSON.stringify(val) : String(val));
            if (!str) return false;
            var lower = str.toLowerCase();
            if (
              lower.includes('sender-wallet') ||
              lower.includes('sender_getproviderstate') ||
              lower.includes('sender:') ||
              lower.includes('no account exist') ||
              lower.includes('sender_') ||
              lower.includes('wallet-providerresult') ||
              lower.includes('failed to get initial state')
            ) {
              return true;
            }
          } catch (_) {}
          return false;
        }

        function checkArgs(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            if (isWalletNoise(args[i])) return true;
          }
          return false;
        }

        var origConsoleError = console.error;
        console.error = function() {
          if (checkArgs(arguments)) return;
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          if (checkArgs(arguments)) return;
          origConsoleWarn.apply(console, arguments);
        };

        var origConsoleLog = console.log;
        console.log = function() {
          if (checkArgs(arguments)) return;
          origConsoleLog.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isWalletNoise(event.message) || isWalletNoise(event.filename) || isWalletNoise(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isWalletNoise(event.reason?.message) || isWalletNoise(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Also prevent noisy message events posted by sender-wallet extension into the iframe
        window.addEventListener('message', function(event) {
          if (isWalletNoise(event.data)) {
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
